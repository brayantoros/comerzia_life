{% extends "admin_layout.html" %}
{% block title %}{{ action }} Producto{% endblock %}
{% block admin_content %}
<h2>{{ action }} Producto</h2>

<form id="productForm" method="post" enctype="multipart/form-data" action="">
  <div class="form-group">
    <label for="nombre"><strong>Nombre</strong></label>
    <input type="text" id="nombre" name="nombre" required maxlength="100" value="{{ producto.nombre if producto else '' }}">
  </div>

  <div class="form-group">
    <label for="descripcion"><strong>Descripción</strong></label>
    <textarea id="descripcion" name="descripcion" rows="4">{{ producto.descripcion if producto else '' }}</textarea>
  </div>

  <div class="form-group">
    <label for="precio"><strong>Precio</strong></label>
    <input type="number" id="precio" name="precio" step="0.01" min="0" required value="{{ producto.precio if producto else '' }}">
  </div>

  <div class="form-group">
    <label for="imagen"><strong>Imagen</strong></label>
    <input type="file" id="imagen" name="imagen" accept="image/*">
    {% if producto and producto.imagen %}
      <div style="margin-top:8px;">
        <small>Imagen actual:</small><br>
        <img src="{{ url_for('uploaded_file', filename=producto.imagen) }}" alt="imagen" style="width:120px; height:120px; object-fit:cover; border-radius:6px; margin-top:6px;">
      </div>
    {% endif %}
  </div>

  <div class="form-group">
    <label for="activo">
      <input type="checkbox" id="activo" name="activo" {% if producto and producto.activo == 1 %}checked{% elif not producto %}checked{% endif %}>
      <strong>Activo</strong>
    </label>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn primary">{{ action }}</button>
    <a class="btn" href="{{ url_for('admin_products') }}">Cancelar</a>
  </div>
</form>

<script>
document.getElementById('productForm').addEventListener('submit', function(e){
  const nombre = document.getElementById('nombre').value.trim();
  const precio = document.getElementById('precio').value;
  if(!nombre){
    e.preventDefault();
    alert('El nombre es obligatorio.');
    return;
  }
  if(precio === '' || isNaN(precio) || Number(precio) < 0){
    e.preventDefault();
    alert('Ingresa un precio válido.');
  }
});
</script>

<style>
.form-group{ margin-bottom:12px; }
.form-group label{ display:block; margin-bottom:6px; }
.form-group input[type="text"],
.form-group input[type="number"],
.form-group textarea{ width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; }
.form-actions{ margin-top:12px; display:flex; gap:8px; }
.btn{ padding:8px 12px; border-radius:4px; border:none; cursor:pointer; text-decoration:none; }
.btn.primary{ background:#2b6cb0; color:#fff; }
</style>
{% endblock %}
