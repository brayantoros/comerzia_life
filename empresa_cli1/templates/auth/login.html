{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 shadow">
      <h3 class="mb-3 text-center">Iniciar sesión</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Usuario o correo</label>
          <input class="form-control" name="nombre_usuario" placeholder="usuario" />
          <div class="form-text">También puedes usar tu correo.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" name="password" required />
        </div>
        <button class="btn btn-primary w-100">Ingresar</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('autusuarios.registro') }}">Crear cuenta</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
