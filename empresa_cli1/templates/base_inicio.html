{% extends "base.html" %}
{% block title %}Panel{% endblock %}
{% block content %}
  <div class="card p-4 shadow">
    <h2>Bienvenido, {{ usuario.nombre }} ({{ usuario.nombre_usuario }})</h2>
    <p class="text-muted">Este es tu panel principal.</p>
    <div class="mt-3 d-flex gap-2">
      <a class="btn btn-primary" href="{{ url_for('productos.lista_productos') }}">Gestionar Productos</a>
      {% if current_user.rol == 'admin' %}
      <a class="btn btn-secondary" href="{{ url_for('usuarios.lista_usuarios') }}">Gestionar Usuarios</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
