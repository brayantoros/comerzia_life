{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Lista de Usuarios</h2>
    <a href="{{ url_for('usuarios.crear_usuario') }}" class="btn btn-primary mb-3">Crear Usuario</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.username }}</td>
                <td>{{ u.email }}</td>
                <td>{{ u.rol }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
